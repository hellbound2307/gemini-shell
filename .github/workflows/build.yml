name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------------
      # Pin ONE SDK. The runner image already ships cmdline-tools, a platform
      # and build-tools. Installing a second build-tools version and mixing
      # aapt2/d8/zipalign/apksigner across the two is how you end up with a
      # corrupt resources.arsc (double length-prefixed strings). So: use the
      # image SDK, install only what is missing, and assert every tool comes
      # from the same directory.
      # ------------------------------------------------------------------
      - name: Resolve and pin Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          test -d "$SDK" || { echo "no SDK at $SDK"; exit 1; }

          # Pick the build-tools version already present; only install if none.
          BT_VER="$(ls "$SDK/build-tools" 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "${BT_VER:-}" ]; then
            echo "no build-tools present; installing"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0" > /dev/null
            BT_VER="$(ls "$SDK/build-tools" | sort -V | tail -1)"
          fi
          echo "Using build-tools $BT_VER"

          PLATFORM="$(ls "$SDK/platforms" 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "${PLATFORM:-}" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" > /dev/null
            PLATFORM="$(ls "$SDK/platforms" | sort -V | tail -1)"
          fi
          echo "Using platform $PLATFORM"

          {
            echo "android_sdk=$SDK"
            echo "build_tools=$SDK/build-tools/$BT_VER"
            echo "android_jar=$SDK/platforms/$PLATFORM/android.jar"
          } >> "$GITHUB_ENV"

      - name: Verify toolchain coherence
        run: |
          set -euo pipefail
          for t in aapt2 d8 zipalign apksigner; do
            printf '%-10s %s\n' "$t" "$("$build_tools/$t" --version 2>&1 | head -1)"
          done
          # Every binary must live in the same pinned directory.
          ls -la "$build_tools" | grep -E 'aapt2|d8|zipalign|apksigner'
          test -f "$android_jar" && echo "android.jar OK: $android_jar"

      - name: Fetch androidx.browser (Custom Tabs only)
        run: |
          set -euo pipefail
          mkdir -p libs
          # androidx.browser has no transitive deps, so the AAR's classes.jar
          # can be used directly. No Gradle, no Maven resolution.
          curl -sSL -o libs/browser.aar \
            "https://dl.google.com/dl/android/maven2/androidx/browser/browser/1.8.0/browser-1.8.0.aar"
          cd libs
          unzip -o -q browser.aar classes.jar
          mv classes.jar browser.jar
          unzip -l browser.jar | grep -c '\.class' | xargs echo "browser.jar class count:"
          ls -la

      - name: Compile resources
        run: |
          set -euo pipefail
          cd app
          "$build_tools/aapt2" compile --dir res -o /tmp/res.zip
          "$build_tools/aapt2" link \
            -o /tmp/base.apk \
            -I "$android_jar" \
            --manifest AndroidManifest.xml \
            --java /tmp/gen \
            --min-sdk-version 23 \
            --target-sdk-version 34 \
            --version-code 1 --version-name 1.0 \
            /tmp/res.zip
          echo "--- resources.arsc after link ---"
          unzip -p /tmp/base.apk resources.arsc > /tmp/pre.arsc
          ls -la /tmp/pre.arsc

      # --------------------------------------------------------------
      # Gate: the resource table must decode cleanly BEFORE we ship it.
      # The v1.0.2 failure was a double length-prefixed string pool that
      # only showed up as a crash on device. Fail the build instead.
      # --------------------------------------------------------------
      - name: Compile Java and dex
        run: |
          set -euo pipefail
          mkdir -p /tmp/classes /tmp/dex

          # The activity lives at app/src/... — resolve from the repo root and
          # assert the file is actually seen. v1.0.2 shipped without the class
          # because this path was wrong and nothing verified the result.
          APP_SRC="app/src"
          if [ ! -d "$APP_SRC" ]; then
            echo "expected sources at $APP_SRC — layout mismatch"; ls -la; exit 1
          fi
          find "$APP_SRC" /tmp/gen -name '*.java' | sort > /tmp/sources.txt
          echo "--- java sources ---"
          cat /tmp/sources.txt
          grep -q 'MainActivity.java' /tmp/sources.txt \
            || { echo "MainActivity.java not in source list"; exit 1; }

          javac -source 8 -target 8 \
            -bootclasspath "$android_jar" \
            -classpath "libs/browser.jar" \
            -d /tmp/classes \
            -Xlint:-options \
            @/tmp/sources.txt

          echo "--- compiled classes ---"
          find /tmp/classes -name '*.class' | sort
          # Fail loudly if the activity itself did not compile.
          test -f /tmp/classes/com/geminishell/app/MainActivity.class \
            || { echo "MainActivity.class was not produced"; exit 1; }

          find /tmp/classes -name '*.class' | sort > /tmp/classes.txt
          "$build_tools/d8" --min-api 23 --lib "$android_jar" \
            --output /tmp/dex \
            @/tmp/classes.txt libs/browser.jar

          test -f /tmp/dex/classes.dex || { echo "d8 produced no classes.dex"; exit 1; }
          ( cd /tmp/dex && zip -q -X /tmp/base.apk classes.dex )
          unzip -l /tmp/base.apk

      - name: Zipalign and sign
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/ks.jks -storepass android \
            -keypass android -alias shell -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Gemini Shell, O=local, C=DZ"
          "$build_tools/zipalign" -f -p 4 /tmp/base.apk /tmp/aligned.apk
          "$build_tools/apksigner" sign --ks /tmp/ks.jks --ks-pass pass:android \
            --key-pass pass:android --out /tmp/gemini-shell.apk /tmp/aligned.apk
          "$build_tools/apksigner" verify --print-certs /tmp/gemini-shell.apk
          sha256sum /tmp/gemini-shell.apk
          ls -la /tmp/gemini-shell.apk

      # --------------------------------------------------------------
      # Crash gate. v1.0.2 shipped a manifest that named MainActivity while
      # the dex contained only the generated R classes, so the app died in
      # ClassNotFoundException before onCreate. Nothing checked. v1.0.6's
      # gate only knew that one class name and passed a still-broken APK.
      # This one checks every declared component plus every Custom Tabs type
      # the activity calls, against the plaintext manifest.
      # --------------------------------------------------------------
      - name: Verify APK will not crash on launch
        run: python3 tools/verify_apk.py /tmp/gemini-shell.apk app/AndroidManifest.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-shell-apk
          path: /tmp/gemini-shell.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" /tmp/gemini-shell.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gemini Shell $TAG" \
            --notes "Custom Tabs launcher for gemini.google.com. No WebView, no ads, INTERNET permission only. NOTE: each build uses a freshly generated signing key, so UNINSTALL any previous version before installing." \
          || gh release upload "$TAG" /tmp/gemini-shell.apk --repo "$GITHUB_REPOSITORY" --clobber